name: LernheftPad
options:
  bundleIdPrefix: de.lernheft
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LernheftPad:
    type: application
    platform: iOS
    sources:
      - path: LernheftPad
    scheme: {}
    info:
      path: LernheftPad/Info.plist
      properties:
        CFBundleDisplayName: Lernheft Stift
        # Die Verbindung zum Surface läuft im eigenen WLAN ohne HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Lernheft Stift verbindet sich im WLAN mit Lernheft Studio auf deinem Surface, damit deine Handschrift sofort dort erscheint."
        NSBonjourServices:
          - _lernheft._tcp
          - _lernheftpad._tcp
        NSCameraUsageDescription: "Mit der Kamera liest Lernheft Stift den QR-Code am Surface und scannt Seiten für deine Notizen."
        NSPhotoLibraryUsageDescription: "Lernheft Stift fügt ausgewählte Fotos in die Notiz am Surface ein."
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.lernheft.stift
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
